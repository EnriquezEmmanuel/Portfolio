  <style type="text/css">
   <![CDATA[
    .str1 {stroke:white; filter:drop-shadow(0px 0px 5px #00CCD2) drop-shadow(0px 0px 2px black);stroke-width:4;stroke-miterlimit:22.9256}
    .str0 {stroke:white; filter:drop-shadow(0px 0px 5px #00CCD2) drop-shadow(0px 0px 2px black);stroke-width:4;stroke-miterlimit:22.9256}
    .str2 {stroke:white; filter:drop-shadow(0px 0px 5px #00CCD2) drop-shadow(0px 0px 2px black);stroke-width:1.181;stroke-miterlimit:22.9256}
    .str4 {stroke:fuchsia;stroke-width:1.181;stroke-miterlimit:22.9256}
    .str3 {stroke:white; filter:drop-shadow(0px 0px 5px #00CCD2) drop-shadow(0px 0px 2px black);stroke-width:4;stroke-linejoin:round;stroke-miterlimit:22.9256}
    .fil1 {fill:transparent}
    .fil0 {fill:transparent;fill-rule:nonzero}
    .fil2 {fill:white; filter:drop-shadow(0px 0px 5px #00CCD2) drop-shadow(0px 0px 2px black);}

    .iconos {
      animation-name: mover;
      animation-duration: 1s;
      animation-fill-mode: forwards;
      animation-delay: .5s;
      cursor: pointer;

      transform-box: fill-box; /*para que no arranque desde el 0,0 del viewbox*/
      offset-rotate: 0deg; /* para que no rote  */
      transform-origin: center;
      offset-distance:0%;

      /* animation-iteration-count: infinite; */
    }
    
    /* Asegura que el área interna transparente del icono también capture los clics */
    .iconos a, .iconos path, .iconos circle, .iconos rect, .iconos polygon {
      pointer-events: all;
    }

