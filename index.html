<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En construcción</title>
    <style>
        :root{ 
            --color1:#2f2f2f; 
            --color2:#f7ae1a;
        }
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 95vh;
            background-color: var(--color2);
        }
        #contenedor-fondo{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: max(500px,50%);
            height: 20em;

            background: repeating-linear-gradient(
                -45deg,
                var(--color1),
                var(--color1) 10px,
                white 10px,
                white 20px
            );

            border-radius: 10px;
            border: 6px solid var(--color1);
            box-shadow: inset 0 0 0 3px white;
        }
        #cartel{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border-radius: 10px;
            border: 6px solid white;
            box-shadow: inset 0 0 0 2px var(--color1);

            background-color: white;
            padding: 2em;
        }
        p{ font:bold 2em Arial; }
        #cursor{
            display: inline-block;
            transform: scale(0.9, 1.1) translateY(-0.1em);
            animation:1s infinite parpadeante ease-in;
        }
        @keyframes parpadeante {
            from{opacity: 1;}
            to{opacity: 0;}
        }
        @media (width<600px){
            p{font-size: 1.5em;}
            #contenedor-fondo{
                width: 85%;
            }
        }
    </style>
</head>
<body>
    <div id="contenedor-fondo">
        <div id="cartel">
            <p>EN CONSTRUCCIÓN<span id="cursor">▮</span></p>
        </div>
    </div>
</body>
    
</html>
